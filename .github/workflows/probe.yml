name: probe
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe per-item evaluation data sources
        run: |
          UA="evaldrift-research/0.1 (measurement-methodology research)"
          probe(){ code=$(curl -sL -o /tmp/o -w "%{http_code}" --max-time 40 -H "User-Agent: $UA" "$1")
            echo "HTTP=$code bytes=$(wc -c < /tmp/o)  $2"
            echo "   head: $(head -c 200 /tmp/o | tr '\n' ' ')"; echo; }
          {
            echo "# per-item eval data probe"
            echo "run_at=$(date -u +%FT%TZ)"
            echo
            probe "https://huggingface.co/api/datasets/nlphuji/DOVE_Lite" "DOVE_Lite metadata"
            probe "https://huggingface.co/api/datasets/nlphuji/DOVE" "DOVE metadata"
            probe "https://datasets-server.huggingface.co/valid" "HF datasets-server"
            probe "https://huggingface.co/api/datasets?search=helm&limit=5" "HF search: helm"
            probe "https://crfm.stanford.edu/helm/classic/latest/" "HELM classic"
            probe "https://storage.googleapis.com/crfm-helm-public/lite/benchmark_output/runs/v1.0.0/run_specs.json" "HELM public bucket"
            probe "https://huggingface.co/api/datasets/cais/mmlu" "MMLU dataset"
            probe "https://openai.com/index/gpt-4/" "control: public web"
          } > PROBE.txt 2>&1
          cat PROBE.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROBE.txt && git commit -m "probe: per-item eval data reachability" || exit 0
          git push
